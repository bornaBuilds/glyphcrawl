[package]
name = "glyphcrawl"
version = "0.1.0"
edition = "2024"
description = "An isometric ASCII dungeon crawler where the heroes and monsters are 3D primitives run through an ASCII shader."
license = "MIT"

[features]
default = ["terminal", "window"]
# Terminal backend (crossterm).
terminal = ["dep:crossterm"]
# Native window backend (minifb + fontdue). X11 only by default (runs through XWayland).
window = ["dep:minifb", "dep:fontdue"]
# Opt-in native Wayland for the window backend (minifb's Wayland path has decoration bugs).
window-wayland = ["window", "minifb/wayland", "minifb/dlopen"]
# Sound effects + ambience. Needs ALSA headers on Linux: `sudo apt install libasound2-dev pkg-config`.
audio = ["dep:kira"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
glam = { version = "0.34", features = ["serde"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
slotmap = "1"

crossterm = { version = "0.29", optional = true }
fontdue = { version = "0.9", optional = true }
kira = { version = "0.12", optional = true, default-features = false, features = ["cpal"] }
minifb = { version = "0.29", optional = true, default-features = false, features = ["x11"] }

[dev-dependencies]
insta = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
